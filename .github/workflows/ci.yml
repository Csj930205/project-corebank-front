# push·PR 마다 lint, 테스트, 빌드(타입 검사 포함)를 돌린다.
# 테스트는 jsdom 에서 fetch 를 가짜로 바꿔 돌리므로 백엔드 서버가 필요 없다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새로 push 하면 앞서 돌던 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b 로 타입 검사를 한 뒤 vite build
      - run: npm run build
